<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Portfolio Antoine DAMBRINE</title>
    <link rel="stylesheet" href="style.css">
    <script src="jquery.js"></script>
</head>
<body>
    <svg id="svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
        <mask id="mask">
            <circle cx="413.30978663905375" cy="452.1209442214923" r="64.53536350925143" fill="black" strokewidth="20px"></circle>
        </mask>
    </svg>
    <img src="https://squareimage.dev/examples/square-blur.png" x="0" y="0"/>
    <style>
        #svg {
            position:absolute;
            top: 0px;
            left: 0px;
            width: 100%;
            height: 100%;
        }

        img{
            mask-image: url(#mask);
        }
    </style>
    <script src="Scripts/SmoothCircles.js"></script>
</body>
</html>
